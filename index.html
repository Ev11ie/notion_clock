<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Blue Clock Widget</title>
    <style>
        :root {
            /* === 修改配色区域 === */
            
            /* 1. 左边（起始）：很浅的冰蓝色 */
            --bar-fill-start: #a6c1ee; 
            
            /* 2. 右边（结束）：深邃的海洋蓝 */
            --bar-fill-end: #2b5876;   
            
            /* 文字颜色：保持深色以确保清晰 */
            --primary-color: #2b5876;  
            
            /* 进度条底槽颜色：极浅的蓝灰色 */
            --bar-bg: #f0f4f8;         
            
            --font-family: 'Courier New', Courier, monospace;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            color: var(--primary-color);
        }

        #clock {
            font-size: 3.5rem;
            font-weight: 300;
            font-family: var(--font-family);
            margin-bottom: 20px;
            letter-spacing: 2px;
            /* 给时间也加一点点透明度，让它不那么生硬 */
            opacity: 0.9; 
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .label {
            width: 50px;
            text-align: right;
            opacity: 0.8;
        }

        .progress-track {
            flex-grow: 1;
            height: 12px;
            background-color: var(--bar-bg);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            /* 渐变方向：默认就是从左(start)到右(end) */
            background: linear-gradient(90deg, var(--bar-fill-start), var(--bar-fill-end));
            
            border-radius: 10px;
            transition: width 0.5s ease-out;
            
            /* === 核心修改：设置 0.8 的透明度 === */
            opacity: 0.8; 
        }

        .value {
            width: 60px;
            text-align: left;
            font-family: var(--font-family);
            font-size: 0.85rem;
            opacity: 0.8;
        }

    </style>
</head>
<body>

    <div id="clock">00:00:00</div>

    <div class="container">
        <div class="row">
            <span class="label">Year</span>
            <div class="progress-track">
                <div class="progress-fill" id="year-bar"></div>
            </div>
            <span class="value" id="year-text">0/365</span>
        </div>

        <div class="row">
            <span class="label">Month</span>
            <div class="progress-track">
                <div class="progress-fill" id="month-bar"></div>
            </div>
            <span class="value" id="month-text">0/30</span>
        </div>

        <div class="row">
            <span class="label">Week</span>
            <div class="progress-track">
                <div class="progress-fill" id="week-bar"></div>
            </div>
            <span class="value" id="week-text">0/7</span>
        </div>
    </div>

    <script>
        function updateTime() {
            // 东八区时间计算逻辑
            const now = new Date();
            const options = { timeZone: 'Asia/Shanghai', hour12: false, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' };
            const cnDateString = new Intl.DateTimeFormat('en-US', options).format(now);
            const targetDate = new Date(cnDateString);

            // 更新时钟
            const timeStr = targetDate.toLocaleTimeString('en-GB', { hour12: false });
            document.getElementById('clock').innerText = timeStr;

            // 1. Week Progress
            let dayOfWeek = targetDate.getDay();
            if (dayOfWeek === 0) dayOfWeek = 7; 
            updateBar('week', dayOfWeek, 7);

            // 2. Month Progress
            const dayOfMonth = targetDate.getDate();
            const daysInMonth = new Date(targetDate.getFullYear(), targetDate.getMonth() + 1, 0).getDate();
            updateBar('month', dayOfMonth, daysInMonth);

            // 3. Year Progress
            const startOfYear = new Date(targetDate.getFullYear(), 0, 1);
            const startOfNextYear = new Date(targetDate.getFullYear() + 1, 0, 1);
            const dayOfYear = Math.floor((targetDate - startOfYear) / (1000 * 60 * 60 * 24)) + 1;
            const daysInYear = Math.floor((startOfNextYear - startOfYear) / (1000 * 60 * 60 * 24));
            updateBar('year', dayOfYear, daysInYear);
        }

        function updateBar(id, value, total) {
            const percentage = (value / total) * 100;
            document.getElementById(`${id}-bar`).style.width = percentage + '%';
            document.getElementById(`${id}-text`).innerText = `${value}/${total}`;
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
